[project]
name = "workday-apply"
version = "0.1.0"
description = "Workday job application assistant with profile persistence and resume import"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "playwright>=1.49.0",
  "rich>=13.9.0",
  "typer>=0.15.0",
  "pydantic>=2.10.0",
  "pypdf>=5.1.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
  "google-api-python-client>=2.150.0",
]

[project.scripts]
workday-apply = "workday_apply.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workday_apply"]
